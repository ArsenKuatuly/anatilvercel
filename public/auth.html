<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
<div class="auth auth--login">
    <aside class="auth__brand" aria-label="Информация о платформе">
        <div class="auth__brand-bg"></div>
        <div class="auth__brand-content">
            <div class="auth__brand-logo">
                <div class="auth__brand-mark">A</div>
                <div class="auth__brand-name">AnaTil</div>
            </div>
            <div class="auth__brand-line"></div>
            <h2 class="auth__brand-title">Казахский язык<br />для профессионалов</h2>
            <p class="auth__brand-subtitle">Современная платформа с AI для изучения казахского языка</p>
        </div>
    </aside>

    <main class="auth__content">
        <div class="auth__wrap">
            <div class="auth__top">
                <div class="logo">AnaTil</div>
                <a href="/index.html" class="auth__back-btn">← Вернуться на главную</a>
            </div>

            <div class="auth__card">
                <h2 class="auth__title">Авторизация</h2>
                <p class="auth__subtitle">Войдите по логину или email</p>

                <label class="auth__label" for="login">Логин или email</label>
                <input class="auth__input" type="text" id="login" placeholder="Введите логин или email" autocomplete="username" />

                <label class="auth__label">Пароль</label>
                <div class="auth__password-wrapper">
                    <input class="auth__input auth__input--password js-password" type="password" name="password" placeholder="Введите пароль" autocomplete="current-password" />
                    <img src="/assets/imgs/showpass.png" alt="Показать пароль" class="auth__toggle-password js-toggle-password" />
                </div>

                <div style="display:flex;justify-content:flex-end;margin:-4px 0 16px;">
                    <button type="button" id="forgotBtn" class="auth__link" style="background:none;border:0;padding:0;cursor:pointer;">Забыли пароль?</button>
                </div>

                <button class="auth__button" id="loginBtn" type="button">Войти</button>

                <div class="auth__divider" aria-hidden="true">
                    <div class="auth__divider-line"></div>
                    <div class="auth__divider-text">или</div>
                </div>

                <p class="auth__footer">Нет аккаунта? <a href="/register.html" class="auth__link">Создать</a></p>
                <p class="auth__message" id="message"></p>
                <p class="auth__note">Нажимая «Войти», вы соглашаетесь с <a href="#" class="auth__link">условиями использования</a></p>
            </div>
        </div>
    </main>
</div>
<script src="/js/login.js"></script>
<script src="/js/showpass.js"></script>
</body>
</html>
