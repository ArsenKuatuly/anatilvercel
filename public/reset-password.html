<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новый пароль</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
<div class="auth auth--login">
    <main class="auth__content" style="width:100%">
        <div class="auth__wrap">
            <div class="auth__top">
                <div class="logo">AnaTil</div>
                <a href="/auth.html" class="auth__back-btn">← Вернуться ко входу</a>
            </div>

            <div class="auth__card">
                <h2 class="auth__title">Новый пароль</h2>
                <p class="auth__subtitle">Установите новый пароль для аккаунта</p>

                <label class="auth__label" for="token">Токен</label>
                <input class="auth__input" type="text" id="token" placeholder="Токен из письма" />

                <label class="auth__label">Новый пароль</label>
                <div class="auth__password-wrapper">
                    <input class="auth__input auth__input--password js-password" type="password" autocomplete="new-password" />
                    <img src="/assets/imgs/showpass.png" alt="Показать пароль" class="auth__toggle-password js-toggle-password" />
                </div>

                <label class="auth__label">Повторите пароль</label>
                <div class="auth__password-wrapper">
                    <input class="auth__input auth__input--password js-password" type="password" autocomplete="new-password" />
                    <img src="/assets/imgs/showpass.png" alt="Показать пароль" class="auth__toggle-password js-toggle-password" />
                </div>

                <button class="auth__button" id="resetPasswordBtn" type="button">Сохранить пароль</button>
                <p class="auth__message" id="message"></p>
            </div>
        </div>
    </main>
</div>
<script src="/js/reset-password.js"></script>
<script src="/js/showpass.js"></script>
</body>
</html>
