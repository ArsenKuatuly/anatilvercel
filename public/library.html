<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Библиотека</title>
    <link rel="stylesheet" href="/css/headerdash.css" />
    <link rel="stylesheet" href="/css/library.css" />
    <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/api.js"></script>

<header class="dash-header" id="header">
    <div class="dash-header__container">
        <a class="dash-header__logo" href="/dashboard.html">AnaTil</a>

        <nav class="dash-header__nav" aria-label="Навигация">
            <a class="dash-header__link" href="/courses">Курсы</a>
            <a class="dash-header__link" href="/myprogress.html">Мой прогресс</a>
            <a class="dash-header__link" href="/library.html">Библиотека</a>
            <a class="dash-header__link" href="/anatilui.html">AI практика</a>
            <a class="dash-header__link" href="/admin" id="adminBtn" style="display:none">
                Админка
            </a>
        </nav>

        <div class="dash-header__actions">
            <a class="dash-header__btn" href="/profile.html">Профиль</a>

            <button class="dash-header__burger" type="button" aria-label="Открыть меню" data-burger>
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>


    <div class="dash-header__mobile" data-mobile hidden>
        <a class="dash-header__m-link" href="/courses">Курсы</a>
        <a class="dash-header__m-link" href="/myprogress.html">Мой прогресс</a>
        <a class="dash-header__m-link" href="/library.html">Библиотека</a>
        <a class="dash-header__m-link" href="/profile.html">Профиль</a>
    </div>
</header>

<div class="library" id="library">

    <div class="library__header">
        <div class="library__container library__container--header">
            <div class="library__titlebox">
                <h1 class="library__title">Библиотека</h1>
                <p class="library__subtitle">Материалы для практики казахского языка</p>
            </div>

            <div class="library__controls">
                <div class="library__search">
          <span class="library__search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="i" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21l-4.3-4.3"></path>
            </svg>
          </span>
                    <input
                            class="library__search-input"
                            id="searchInput"
                            type="text"
                            placeholder="Поиск по словам и темам…"
                            autocomplete="off"
                    />
                </div>

                <div class="library__tabs hide-scrollbar" id="tabs">
                    <div class="library__tabs-row" id="tabsRow"></div>
                </div>
            </div>
        </div>
    </div>

    <main class="library__main">
        <div class="library__container library__container--main">

            <section class="library__continue" id="continueBlock"></section>

            <section class="library__content">
                <div class="library__grid" id="materialsGrid"></div>
                <div class="library__empty" id="emptyState" hidden></div>
                <div class="library__skeleton" id="skeletonGrid" hidden></div>
            </section>
        </div>
    </main>

    <div class="material-modal" id="materialModal" hidden>
        <div class="material-modal__overlay" id="modalOverlay" role="presentation">
            <div class="material-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <div class="material-modal__head">
                    <div class="material-modal__head-top">
                        <div class="material-modal__meta">
                            <div class="material-modal__badges">
                                <span class="material-modal__emoji" id="modalEmoji">📘</span>
                                <span class="material-modal__pill material-modal__pill--soft" id="modalType">Грамматика</span>
                                <span class="material-modal__pill material-modal__pill--blueSoft" id="modalLevel">A1</span>
                                <span class="material-modal__pill material-modal__pill--gray" id="modalDuration">5 мин</span>
                            </div>

                            <h2 class="material-modal__title" id="modalTitle">Материал</h2>
                            <p class="material-modal__desc" id="modalDesc">Описание</p>
                        </div>

                        <button class="material-modal__close" id="modalClose" type="button" aria-label="Закрыть">
                            <svg viewBox="0 0 24 24" class="i" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M18 6L6 18"></path>
                                <path d="M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="material-modal__progress">
                        <div class="material-modal__bar">
                            <div class="material-modal__bar-fill" id="modalProgressFill" style="width:0%"></div>
                        </div>
                        <p class="material-modal__progress-text" id="modalProgressText">Прогресс: 0%</p>
                    </div>
                </div>

                <div class="material-modal__body" id="modalBody"></div>

                <div class="material-modal__foot">
                    <button class="btn btn--gray" id="modalBackBtn" type="button">
                        <svg viewBox="0 0 24 24" class="i i--sm" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                        <span class="material-modal__foot-text">Назад</span>
                    </button>

                    <div class="material-modal__foot-right">
                        <button class="btn btn--outline" id="modalSaveBtn" type="button">
                            <svg viewBox="0 0 24 24" class="i i--sm" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 0 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            </svg>
                            <span class="material-modal__foot-text">Сохранить</span>
                        </button>

                        <button class="btn btn--blue" id="modalContinueBtn" type="button">
                            <span>Продолжить</span>
                            <svg viewBox="0 0 24 24" class="i i--sm" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9 18l6-6-6-6"></path>
                            </svg>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/js/authFetch.js"></script>
<script src="/js/library.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/headerdash.js"></script>
</body>
</html>
