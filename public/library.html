<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Библиотека</title>
    <link rel="stylesheet" href="/css/headerdash.css" />
  <link rel="stylesheet" href="/css/library.css" />
    <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/api.js"></script>

  <div class="library" id="library">
    <header class="library__header">
      <div class="library__container library__container--header">
        <div class="library__titlebox">
          <h1 class="library__title">Библиотека</h1>
          <p class="library__subtitle">Материалы для практики казахского языка</p>
        </div>

        <div class="library__controls">
          <div class="library-search">
            <span class="library-search__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <input
              class="library-search__input"
              id="searchInput"
              type="text"
              placeholder="Поиск по словам и темам…"
              autocomplete="off"
            />
          </div>

          <div class="library-tabs">
            <div class="library-tabs__track hide-scrollbar" id="tabsTrack" role="tablist" aria-label="Категории"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="library__main">
      <div class="library__container">
        <section class="library-continue" id="continueBlock" hidden></section>

        <section class="library-content" aria-live="polite">
          <div class="library-grid" id="materialsGrid"></div>

          <div class="library-empty" id="emptyState" hidden>
            <div class="library-empty__card">
              <div class="library-empty__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M8.5 8.5 12.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M12.5 8.5 8.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <h3 class="library-empty__title">Ничего не найдено</h3>
              <p class="library-empty__text">Попробуйте изменить запрос или выбрать другую категорию</p>
              <button class="btn btn--primary" id="clearBtn" type="button">Очистить поиск</button>
            </div>
          </div>

          <div class="library-skeleton" id="skeletonGrid" hidden></div>
        </section>
      </div>
    </main>
  </div>

<script src="/js/authFetch.js"></script>
<script src="/js/library.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/headerdash.js"></script>
</body>
</html>
