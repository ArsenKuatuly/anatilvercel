<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
<div class="auth auth--login">
    <main class="auth__content" style="width:100%">
        <div class="auth__wrap">
            <div class="auth__top">
                <div class="logo">AnaTil</div>
                <a href="/auth.html" class="auth__back-btn">← Назад ко входу</a>
            </div>

            <div class="auth__card">
                <h2 class="auth__title">Забыли пароль?</h2>
                <p class="auth__subtitle">Введите email, и мы отправим ссылку для сброса</p>

                <label class="auth__label" for="email">Email</label>
                <input class="auth__input" type="email" id="email" autocomplete="email" placeholder="Введите email" />

                <button class="auth__button" id="forgotSubmitBtn" type="button">Отправить ссылку</button>
                <p class="auth__message" id="message"></p>
                <p id="resetLinkWrap" class="auth__note" hidden>Тестовая ссылка: <a id="resetLink" class="auth__link" href="#"></a></p>
            </div>
        </div>
    </main>
</div>
<script src="/js/forgot-password.js"></script>
</body>
</html>
