<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Курс — AnaTil</title>

  <link rel="stylesheet" href="/css/courselvl.css" />
  <link rel="stylesheet" href="/css/headerdash.css" />
</head>
<body>

  <!-- если у тебя есть guard/api как на других страницах — оставь эти подключения -->
  <script src="/js/auth-guard.js"></script>
  <script src="/js/api.js"></script>

  <!-- Header -->
  <header class="dash-header" id="header">
    <div class="dash-header__container">
      <a class="dash-header__logo" href="/dashboard.html">AnaTil</a>

      <nav class="dash-header__nav" aria-label="Навигация">
        <a class="dash-header__link" href="/courses">Курсы</a>
        <a class="dash-header__link" href="/progress">Мой прогресс</a>
        <a class="dash-header__link" href="/library">Библиотека</a>
      </nav>

      <div class="dash-header__actions">
        <a class="dash-header__btn" href="/profile.html">Профиль</a>

        <button class="dash-header__burger" type="button" aria-label="Открыть меню" data-burger>
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div class="dash-header__mobile" data-mobile hidden>
      <a class="dash-header__m-link" href="/courses">Курсы</a>
      <a class="dash-header__m-link" href="/progress">Мой прогресс</a>
      <a class="dash-header__m-link" href="/library">Библиотека</a>
      <a class="dash-header__m-link" href="/profile.html">Профиль</a>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="course">
        <!-- Hero -->
        <section class="course-hero">
          <div class="course-hero__top">
            <div class="course-hero__text">
              <h1 class="course-hero__title" id="courseTitle">Курс</h1>
              <p class="course-hero__desc">
                Пройдите модули по порядку. Первый незавершённый урок будет доступен для продолжения.
              </p>
            </div>

            <div class="course-hero__stats">
              <div class="stat">
                <div class="stat__label">Модулей</div>
                <div class="stat__value" id="moduleCount">—</div>
              </div>
              <div class="stat">
                <div class="stat__label">Уроков</div>
                <div class="stat__value" id="lessonCount">—</div>
              </div>
              <div class="stat">
                <div class="stat__label">Прогресс</div>
                <div class="stat__value"><span id="courseProgress">0</span>%</div>
              </div>
            </div>
          </div>

          <div class="course-hero__progress">
            <div class="progress">
              <div class="progress__bar" id="progressBar" style="width: 0%"></div>
            </div>

            <a class="course-hero__next" id="nextLessonBtn" href="#" aria-disabled="true">
              Продолжить
            </a>
          </div>
        </section>

        <!-- Modules (ВАЖНО: сюда подставляются модули) -->
        <div id="modules"></div>

        <!-- Final task (будет создан/заполнен скриптом; можно оставить пустым) -->
        <div id="finalTask" class="final-task" style="display:none;">
          <div class="final-task__head">
            <div class="final-task__icon" aria-hidden="true">🏆</div>
            <div class="final-task__title-wrap">
              <div class="final-task__title">Итоговое задание</div>
              <div class="final-task__badge" id="finalTaskBadge">—</div>
            </div>
          </div>

          <p class="final-task__desc" id="taskDescription"></p>

          <button class="final-task__btn" id="startTaskBtn" type="button" disabled>
            Загрузка...
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/authFetch.js"></script>
  <script src="/js/coursemodul.js"></script>

  <!-- маленький JS только для бургера (не мешает coursemodul.js) -->
  <script>
    (function () {
      const btn = document.querySelector("[data-burger]");
      const mobile = document.querySelector("[data-mobile]");
      if (!btn || !mobile) return;

      const toggle = () => {
        const isHidden = mobile.hasAttribute("hidden");
        if (isHidden) mobile.removeAttribute("hidden");
        else mobile.setAttribute("hidden", "");
        btn.setAttribute("aria-expanded", String(isHidden));
      };

      btn.addEventListener("click", toggle);

      document.addEventListener("click", (e) => {
        if (mobile.hasAttribute("hidden")) return;
        if (e.target.closest("[data-burger]") || e.target.closest("[data-mobile]")) return;
        mobile.setAttribute("hidden", "");
        btn.setAttribute("aria-expanded", "false");
      });
    })();
  </script>
</body>
</html>
