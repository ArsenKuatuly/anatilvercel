<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курс</title>
    <link rel="stylesheet" href="/courselvl.css">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/api.js"></script>

<header class="header" id="header">
    <div class="header__container">
        <a class="header__logo" href="index.html">AnaTil</a>

        <!-- DESKTOP NAV -->
        <nav class="header__nav nav nav--desktop">
            <a class="nav__link" href="#promo" data-key="about">О нас</a>
            <a class="nav__link" href="#courses" data-key="courses_nav">Курсы</a>
            <a class="nav__link" href="#important" data-key="important">Преимущества</a>
            <a class="nav__link" href="#contacts" data-key="contacts">Контакты</a>
        </nav>

        <div class="header__actions header__actions--desktop">
            <div class="header__actions header__actions--mobile">

                <a href="/admin" id="adminBtn" style="display:none">
                    ⚙ Админ панель
                </a>

                <a href="profile.html"><button class="btn cta" data-key="check_level">Ваш профиль</button></a>
            </div>
        </div>

        <!-- BURGER (mobile) -->
        <button class="header__burger" type="button" aria-label="Открыть меню" aria-expanded="false">
            ☰
        </button>
    </div>

    <!-- MOBILE MENU (добавили, но классы старые не меняли) -->
    <div class="header__mobile" hidden>
        <div class="header__container header__container--mobile">
            <nav class="header__nav nav nav--mobile">
                <a class="nav__link" href="#promo" data-key="about">О нас</a>
                <a class="nav__link" href="#courses" data-key="courses_nav">Курсы</a>
                <a class="nav__link" href="#important" data-key="important">Преимущества</a>

                <a class="nav__link" href="#contacts" data-key="contacts">Контакты</a>
            </nav>

            <div class="header__actions header__actions--mobile">

                <a href="/admin" class="adminBtn" style="display:none">
                    ⚙ Админ панель
                </a>

                <a href="profile.html"><button class="btn cta" data-key="check_level">Ваш профиль</button></a>
            </div>
        </div>
    </div>


</header>

<div class="course">
    <h1 id="courseTitle">Курс</h1>

    <!-- сюда JS вставит модули -->
    <div id="modules"></div>
</div>
<div id="lessonContent"></div>
<div class="chat" id="chat" hidden>
    <div class="chat-window" role="dialog" aria-label="AI Ассистент">
        <div class="chat-head">
            <div class="chat-avatar">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z"
                          stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="chat-head-text">
                <div class="chat-title">AI Ассистент</div>
                <div class="chat-subtitle">Онлайн • Ответим быстро</div>
            </div>

            <button class="icon-btn chat-close" type="button" aria-label="Закрыть чат">
                ✕
            </button>
        </div>

        <div class="chat-body" id="chatBody"></div>

        <div class="chat-input">
            <div>
                <input id="chatInput" type="text" placeholder="Напишите сообщение..." />
                <button class="chat-send" id="chatSend" type="button">➤</button>
            </div>
            <div class="chat-hint">Обычно отвечаем в течение 2 минут</div>
        </div>
    </div>
</div>




<script src="/js/authFetch.js"></script>



<script src="/js/coursemodul.js"></script>


<script src="/js/chat.js"></script>


</body>
</html>
