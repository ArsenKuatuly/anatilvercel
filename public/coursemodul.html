<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Курс</title>

    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/headerdash.css" />
    <link rel="stylesheet" href="/css/chat.css" />
</head>

<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/api.js"></script>

<header class="header" id="header">
    <div class="header__container">
        <a class="header__logo" href="/">AnaTil</a>


        <nav class="header__nav nav nav--desktop">
            <a class="nav__link" href="/courses">Курсы</a>
            <a class="nav__link" href="/progress">Мой прогресс</a>
            <a class="nav__link" href="/library">Библиотека</a>


            <a class="nav__link nav__link--admin" href="/admin" id="adminBtn" style="display:none">
                Админ панель
            </a>
        </nav>


        <div class="header__actions header__actions--desktop">
            <a class="header__profile" href="/profile.html">
          <span class="header__icon" aria-hidden="true">

            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2-8 4.5V21h16v-2.5c0-2.5-3.6-4.5-8-4.5Z"/>
            </svg>
          </span>
                <span class="header__profile-text">Профиль</span>
            </a>
        </div>

        <!-- BURGER (mobile) -->
        <button class="header__burger" type="button" aria-label="Открыть меню" aria-expanded="false">
            <!-- "☰" можно оставить, но так ближе к дизайну -->
            <span class="header__burger-icon" aria-hidden="true"></span>
        </button>
    </div>

    <!-- MOBILE MENU -->
    <div class="header__mobile" hidden>
        <div class="header__container header__container--mobile">
            <nav class="header__nav nav nav--mobile">
                <a class="nav__link" href="/courses">Курсы</a>
                <a class="nav__link" href="/progress">Мой прогресс</a>
                <a class="nav__link" href="/library">Библиотека</a>

                <a class="nav__link nav__link--admin" href="/admin" class="adminBtn" style="display:none">
                    Админ панель
                </a>
            </nav>

            <div class="header__actions header__actions--mobile">
                <a class="header__profile header__profile--mobile" href="/profile.html">
            <span class="header__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2-8 4.5V21h16v-2.5c0-2.5-3.6-4.5-8-4.5Z"/>
              </svg>
            </span>
                    <span class="header__profile-text">Профиль</span>
                </a>
            </div>
        </div>
    </div>
</header>


<div class="course">
    <h1 id="courseTitle">Курс</h1>
    <div id="modules"></div>
</div>

<div id="lessonContent"></div>

<script src="/js/authFetch.js"></script>
<script src="/js/coursemodul.js"></script>
<script src="/js/chat.js"></script>


<script src="/js/header.js"></script>
</body>
</html>
