<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Курс</title>

    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/chat.css" />
</head>

<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/api.js"></script>

<header class="header" id="header">
    <div class="header__container">
        <a class="header__logo" href="index.html">AnaTil</a>

        <!-- DESKTOP NAV -->
        <nav class="header__nav nav nav--desktop">
            <a class="nav__link" href="#promo" data-key="about">О нас</a>
            <a class="nav__link" href="#courses" data-key="courses_nav">Курсы</a>
            <a class="nav__link" href="#important" data-key="important">Преимущества</a>
            <a class="nav__link" href="#contacts" data-key="contacts">Контакты</a>
        </nav>

        <div class="header__actions header__actions--desktop">
            <a href="/admin" id="adminBtn" style="display:none">⚙ Админ панель</a>
            <a href="profile.html"><button class="btn cta" data-key="check_level">Ваш профиль</button></a>
        </div>

        <!-- BURGER (mobile) -->
        <button class="header__burger" type="button" aria-label="Открыть меню" aria-expanded="false">☰</button>
    </div>

    <!-- MOBILE MENU -->
    <div class="header__mobile" hidden>
        <div class="header__container header__container--mobile">
            <nav class="header__nav nav nav--mobile">
                <a class="nav__link" href="#promo" data-key="about">О нас</a>
                <a class="nav__link" href="#courses" data-key="courses_nav">Курсы</a>
                <a class="nav__link" href="#important" data-key="important">Преимущества</a>
                <a class="nav__link" href="#contacts" data-key="contacts">Контакты</a>
            </nav>

            <div class="header__actions header__actions--mobile">
                <a href="/admin" class="adminBtn" style="display:none">⚙ Админ панель</a>
                <a href="profile.html"><button class="btn cta" data-key="check_level">Ваш профиль</button></a>
            </div>
        </div>
    </div>
</header>

<main class="course-page">
    <section class="course">
        <!-- Верх курса (как в “красивом” дизайне, но классами по-твоему) -->
        <div class="course__top">
            <div class="course__info">
                <h1 class="course__title" id="courseTitle">Курс</h1>
                <p class="course__desc" id="courseDesc" style="display:none"></p>

                <div class="course__meta" id="courseMeta" style="display:none"></div>
            </div>

            <div class="course__progress" id="courseProgress" style="display:none">
                <div class="progress__row">
                    <div class="progress__label">Прогресс</div>
                    <div class="progress__value" id="progressValue">0%</div>
                </div>
                <div class="progress__bar">
                    <div class="progress__fill" id="progressFill" style="width:0%"></div>
                </div>
                <div class="progress__hint" id="progressHint">0/0</div>
            </div>
        </div>

        <!-- сюда JS вставит модули -->
        <div class="modules" id="modules"></div>

        <!-- итоговое задание (твой js создаёт, но пусть будет сразу) -->
        <div class="final-task" id="finalTask" style="display:none;">
            <p class="final-task__text" id="taskDescription"></p>
            <button class="final-task__btn" id="startTaskBtn" type="button" disabled>Завершите курс</button>
        </div>
    </section>

    <section class="lesson-view" id="lessonContent"></section>
</main>

<script src="/js/authFetch.js"></script>
<script src="/js/coursemodul.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
