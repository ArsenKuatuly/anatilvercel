<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курс</title>
    <link rel="stylesheet" href="/courselvl.css">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<header class="header" id="header">
    <div class="header__container">
        <div class="logo" id="logoBtn">AnaTil</div>


        <nav class="nav">
            <a href="#promo" data-key="about">О нас</a>
            <a href="#reasons" data-key="benefits">Преимущества</a>
            <a href="#courses" data-key="courses_nav">Курсы</a>
            <a href="#" data-key="contacts">Контакты</a>
        </nav>


        <div class="header__actions">


            <a href="/profile.html"><button class="btn" id="cta" data-key="check_level">Ваш профиль</button></a>
        </div>
    </div>
</header>

<div class="course">
    <div class="course-header">

        <h1 id="courseTitle">Загрузка курса...</h1>

        <p id="courseDescription"></p>
    </div>



    <div id="modules"></div>
</div>

<section class="ai-assistant">

    <button class="ai-assistant__toggle" type="button" aria-label="Открыть чат">
        <img
                class="ai-assistant__avatar"
                src="/imgs/aichat.png"
                alt="AI Assistant"
        />
    </button>


    <div class="ai-assistant__chat">
        <div class="ai-assistant__header">
            <span class="ai-assistant__title">ИИ-Ассистент</span>
            <button class="ai-assistant__close" type="button">✕</button>
        </div>

        <div class="ai-assistant__messages"></div>

        <div class="ai-assistant__input">
            <input
                    class="ai-assistant__field"
                    type="text"
                    placeholder="Введите сообщение..."
            />
            <button class="ai-assistant__send">➤</button>
        </div>
    </div>
</section>

<script src="/js/authFetch.js"></script>
<script src="/course.js"></script>
<script src="/js/coursemodul.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
