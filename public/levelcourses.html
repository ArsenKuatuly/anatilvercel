<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рекомендованный курс</title>
    <link rel="stylesheet" href="levelcourses.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header" id="header">
    <div class="header__container">
        <div class="logo" id="logoBtn">AnaTil</div>


        <nav class="nav">
            <a href="dashboard.html/#promo" data-key="about">О нас</a>
            <a href="dashboard.html/#reasons" data-key="benefits">Преимущества</a>
            <a href="dashboard.html/#courses" data-key="courses_nav">Курсы</a>
            <a href="dashboard.html/#" data-key="contacts">Контакты</a>
        </nav>


        <div class="header__actions">
            <div class="lang-switch">
                <button data-lang="kz" class="lang">KZ</button>
                <button data-lang="ru" class="lang active">RU</button>
                <button data-lang="en" class="lang">EN</button>
            </div>

            <a href="profile.html"><button class="btn" id="cta" data-key="check_level">Ваш профиль</button></a>
        </div>
    </div>
</header>

<div class="levelcourses">
    <h1 class="levelcourses__title">Ваш рекомендованный курс</h1>

    <div id="courseCard" class="course">
        <!-- курс подставится через JS -->
    </div>

    <div class="levelcourses__actions">
        <button id="goProfile" class="btn">В профиль</button>
        <button id="goHome" class="btn btn--secondary">На главную</button>
    </div>
</div>

<script src="js/authFetch.js"></script>
<script src="/js/header.js"></script>
<script src="/js/i18n.js"></script>
<script src="levelcourses.js"></script>
</body>
</html>
