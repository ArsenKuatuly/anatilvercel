<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Итоговое задание</title>
    <link rel="stylesheet" href="/finallytask.css">
    <link rel="stylesheet" href="/css/chat.css">

</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/api.js"></script>


<div class="task-container">
    <h1>Итоговое задание</h1>

    <p id="taskDescription">Загрузка задания...</p>

    <div class="questions" id="questionsContainer">

    </div>

    <div class="buttons">
        <button id="backBtn">Назад к курсу</button>
        <button id="submitTaskBtn">Отправить ответы</button>
    </div>

    <div id="resultMessage" class="hidden"></div>
</div>

<div class="chat" id="chat" hidden>
    <div class="chat-window" role="dialog" aria-label="AI Ассистент">
        <div class="chat-head">
            <div class="chat-avatar">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z"
                          stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="chat-head-text">
                <div class="chat-title">AI Ассистент</div>
                <div class="chat-subtitle">Онлайн • Ответим быстро</div>
            </div>

            <button class="icon-btn chat-close" type="button" aria-label="Закрыть чат">
                ✕
            </button>
        </div>

        <div class="chat-body" id="chatBody"></div>

        <div class="chat-input">
            <div>
                <input id="chatInput" type="text" placeholder="Напишите сообщение..." />
                <button class="chat-send" id="chatSend" type="button">➤</button>
            </div>
            <div class="chat-hint">Обычно отвечаем в течение 2 минут</div>
        </div>
    </div>
</div>

<script src="/js/authFetch.js"></script>
<script src="/js/finallytask.js"></script>
<script src="/js/chat.js"></script>

</body>
</html>
